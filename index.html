    // Helper Component to refresh Lucide Icons automatically on state change
    function LucideTrigger() {
      useEffect(() => {

    // Interactive Map Component
    function InteractiveMap({ stations, selectedStation, onSelectStation, onFuelClick, darkMode }) {
      const [activeFilter, setActiveFilter] = useState("all");
      const [selectedFuelType, setSelectedFuelType] = useState("gasoline");
      const [searchQuery, setSearchQuery] = useState("");
      const [isNavigating, setIsNavigating] = useState(false);

      const userCoords = { lat: -23.5645, lng: -46.6620 };

      const stationsWithDistance = useMemo(() => {
        return stations.map(station => {
          const dLat = (station.lat - userCoords.lat) * 111;
          const dLng = (station.lng - userCoords.lng) * 111 * Math.cos(userCoords.lat * Math.PI / 180);
          const distance = parseFloat(Math.sqrt(dLat * dLat + dLng * dLng).toFixed(2));
          return { ...station, distance };
        });
      }, [stations]);

      const filteredStations = useMemo(() => {
        let result = [...stationsWithDistance];
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          result = result.filter(s => s.name.toLowerCase().includes(q) || s.address.toLowerCase().includes(q));
        }
        if (activeFilter === "cheapest") {
          result.sort((a, b) => a.prices[selectedFuelType] - b.prices[selectedFuelType]);
        } else if (activeFilter === "closest") {
          result.sort((a, b) => (a.distance || 0) - (b.distance || 0));
        } else if (activeFilter === "conveniência") {
          result = result.filter(s => s.features.includes("Loja de Conveniência"));
        }
        return result;
      }, [stationsWithDistance, activeFilter, selectedFuelType, searchQuery]);

      const cheapestStationId = useMemo(() => {
        if (stations.length === 0) return "";
        let minId = stations[0].id;
        let minPrice = stations[0].prices[selectedFuelType];
        stations.forEach(s => {
          if (s.prices[selectedFuelType] < minPrice) {
            minPrice = s.prices[selectedFuelType];
            minId = s.id;
          }
        });
        return minId;
      }, [stations, selectedFuelType]);

        Petrobras: { bg: "bg-emerald-500", text: "text-emerald-500", pin: "#10B981" },
        Ipiranga: { bg: "bg-yellow-500", text: "text-yellow-600", pin: "#F59E0B" },
        Shell: { bg: "bg-red-500", text: "text-red-500", pin: "#EF4444" },
        Ale: { bg: "bg-orange-500", text: "text-orange-500", pin: "#F97316" },
        Independent: { bg: "bg-gray-500", text: "text-gray-500", pin: "#6B7280" },

      const mapScale = 5800;

        const x = 200 + (lng - mapCenter.lng) * mapScale * 1.5;
        const y = 200 - (lat - mapCenter.lat) * mapScale;
        return { x, y };
      };

        setIsNavigating(true);
        setTimeout(() => setIsNavigating(false), 4500);

          </div>

          <div className="lg:col-span-7 h-[520px] rounded-xl overflow-hidden relative border border-zinc-200 dark:border-zinc-800 bg-sky-100 dark:bg-zinc-950 flex flex-col shadow-inner">
            <div className="absolute inset-0">
              <svg className="w-full h-full opacity-80" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <line x1="20" y1="280" x2="380" y2="100" stroke={darkMode ? "#3f3f46" : "#cbd5e1"} strokeWidth="12" />
                <line x1="100" y1="50" x2="260" y2="350" stroke={darkMode ? "#3f3f46" : "#cbd5e1"} strokeWidth="8" />
                <line x1="50" y1="120" x2="190" y2="370" stroke={darkMode ? "#3f3f46" : "#cbd5e1"} strokeWidth="10" />
                {selectedStation && (
                  <path
                    d={`M ${getSvgCoords(userCoords.lat, userCoords.lng).x} ${getSvgCoords(userCoords.lat, userCoords.lng).y} L ${getSvgCoords(selectedStation.lat, selectedStation.lng).x} ${getSvgCoords(selectedStation.lat, selectedStation.lng).y}`}
                    stroke="#10B981" strokeWidth="3" strokeDasharray="5,5" fill="none"
                  />
                )}
                <circle cx={getSvgCoords(userCoords.lat, userCoords.lng).x} cy={getSvgCoords(userCoords.lat, userCoords.lng).y} r="6" fill="#10B981" stroke="#FFFFFF" strokeWidth="2" />
              </svg>
            </div>

            <div className="absolute inset-0 pointer-events-none">
              {filteredStations.map((station) => {
                const coords = getSvgCoords(station.lat, station.lng);
                const isSelected = selectedStation?.id === station.id;
                const color = brandColors[station.brand]?.bg || "bg-zinc-500";
                return (
                  <button
                    id={`map-pin-${station.id}`}

                    onClick={() => onSelectStation(station)}
                    style={{ left: `${coords.x}px`, top: `${coords.y}px` }}
                    className="absolute pointer-events-auto transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition-transform"

                    <div className={`w-8 h-8 rounded-full ${isSelected ? "bg-emerald-500 text-white" : `${color} text-zinc-950`} flex items-center justify-center shadow-lg border border-white`}>

            <div className="absolute bottom-4 left-4 right-4 bg-white/95 dark:bg-zinc-900/95 backdrop-blur border border-zinc-200 dark:border-zinc-800 p-3 rounded-xl shadow-lg pointer-events-auto">

                <div>
                  <div className="flex justify-between items-center">
                    <div>
                      <h5 className="font-bold text-xs">{selectedStation.name}</h5>
                      <p className="text-[10px] text-zinc-500 line-clamp-1">{selectedStation.address}</p>
                    </div>
                    <span className="text-xs font-extrabold text-emerald-500">R$ {selectedStation.prices[selectedFuelType].toFixed(2)} / L</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 mt-2">
                    <button id="map-btn-navigate" onClick={handleStartRoute} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500/10 text-emerald-500 flex items-center justify-center gap-1">
                      <i data-lucide="navigation" className="w-3 h-3"></i> {isNavigating ? "Navegando..." : "Traçar Rota"}
                    </button>
                    <button id="map-btn-fuel" onClick={() => onFuelClick(selectedStation)} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 text-white flex items-center justify-center gap-1">

                <div className="text-center text-xs text-zinc-500 py-1">Selecione um posto para traçar rotas e abastecer via QR Code.</div>

            {isNavigating && (

                  <h4 className="font-bold text-sm">Navegando...</h4>
                  <p className="text-xs text-zinc-400 mt-1">Conectando ao sistema GPS integrado.</p>
                </div>
              </div>
            )}
          </div>
        </div>
      );

    // Fueling Calculator Component
    function FuelingCalculator({ station, user, onPaymentSuccess, darkMode }) {
      const [fuelType, setFuelType] = useState("gasoline");
      const [liters, setLiters] = useState("30");
      const [totalCost, setTotalCost] = useState("");
      const [showQrModal, setShowQrModal] = useState(false);
      const [qrStep, setQrStep] = useState("scan");
      const [authCode, setAuthCode] = useState("");
      const [errorMessage, setErrorMessage] = useState("");

      const currentPrice = station.prices[fuelType] || 5.00;

      useEffect(() => {
        if (liters && !isNaN(Number(liters))) {
          setTotalCost((Number(liters) * currentPrice).toFixed(2));
        } else {
          setTotalCost("");
        }
      }, [liters, fuelType, station]);

      const handleLitersChange = (val) => {
        setLiters(val);
        if (val && !isNaN(Number(val))) {
          setTotalCost((Number(val) * currentPrice).toFixed(2));
        } else {
          setTotalCost("");
        }
      };

      const handleCostChange = (val) => {
        setTotalCost(val);
        if (val && !isNaN(Number(val))) {
          setLiters((Number(val) / currentPrice).toFixed(2));
        } else {
          setLiters("");
        }
      };

      const handleStartPayment = () => {
        if (!liters || Number(liters) <= 0) {
          setErrorMessage("Por favor, insira um volume válido.");
          return;
        }
        setErrorMessage("");
        setShowQrModal(true);
        setQrStep("scan");
      };

      const handleScanPump = () => setQrStep("auth");

      const handleAuthenticate = () => {
        if (user.isTwoFactorEnabled && authCode.length < 4) {
          setErrorMessage("Código 2FA inválido.");
          return;
        }
        setErrorMessage("");
        setQrStep("gateway");

        setTimeout(() => {
          const generatedRecord = {
            id: "h_" + Date.now(),
            date: new Date().toISOString(),
            stationId: station.id,
            stationName: station.name,
            fuelType,
            pricePerLiter: currentPrice,
            liters: Number(liters),
            totalCost: Number(totalCost),
            pointsEarned: Math.floor(Number(totalCost)),
            paymentMethod: "QR Code",
          };
          setQrStep("success");
          setTimeout(() => {
            setShowQrModal(false);
            onPaymentSuccess(generatedRecord);
          }, 1800);
        }, 1500);
      };

      const fuelLabels = { gasoline: "Gasolina Comum", ethanol: "Etanol Hidratado", diesel: "S10 Diesel", premiumGas: "Aditivada" };

      return (
        <div id="fueling-calculator-section" className={`rounded-2xl border p-5 shadow-lg ${
          darkMode ? "bg-zinc-900 border-zinc-800 text-zinc-100" : "bg-white border-zinc-200 text-zinc-900"
        }`}>
          <LucideTrigger />
          <div className="flex justify-between items-start mb-4">
            <div>
              <h3 className="text-lg font-bold flex items-center gap-2">

    // History and Analytics Component
    function HistoryAndAnalytics({ history, user, darkMode }) {
      const [selectedMonth, setSelectedMonth] = useState("Todos");
      const [activeMetric, setActiveMetric] = useState("spent");
      const [showReportEmail, setShowReportEmail] = useState(false);
      const [reportSuccess, setReportSuccess] = useState("");

      const filteredHistory = useMemo(() => {
        return history.filter(h => {
          if (selectedMonth === "Todos") return true;
          if (selectedMonth === "Julho") return h.date.includes("-07-");
          if (selectedMonth === "Junho") return h.date.includes("-06-");
          return true;
        });
      }, [history, selectedMonth]);

      const stats = useMemo(() => {
        let totalSpent = 0, totalLiters = 0;
        filteredHistory.forEach(h => {
          totalSpent += h.totalCost;
          totalLiters += h.liters;
        });
        return { totalSpent, totalLiters, savings: totalLiters * 0.42 };

        setReportSuccess("Enviando relatório...");
        setTimeout(() => {
          setReportSuccess(`Sucesso! Relatório consolidado enviado para ${user.email}`);

            setReportSuccess("");
            setShowReportEmail(false);
          }, 2500);

              <span className="text-[10px] text-zinc-500 uppercase font-black">Total Gasto</span>
              <span className="text-lg font-black block mt-0.5">R$ {stats.totalSpent.toFixed(2)}</span>

            <div className="p-3 bg-zinc-50 dark:bg-zinc-900/40 border border-zinc-200 dark:border-zinc-800 rounded-xl">

    // Security & 2FA Component
    function SecurityAuth({ user, onSecurityUpdate, darkMode }) {
      const [showBiometricsModal, setShowBiometricsModal] = useState(false);
      const [show2faSetup, setShow2faSetup] = useState(false);
      const [verificationCode, setVerificationCode] = useState("");

      const handleToggleBiometrics = () => {
        if (user.isBiometricsConfigured) {
          onSecurityUpdate(undefined, false);
        } else {
          setShowBiometricsModal(true);
          setTimeout(() => {
            onSecurityUpdate(undefined, true);
            setShowBiometricsModal(false);
          }, 2000);
        }
      };

      const handleToggle2FA = () => {
        if (user.isTwoFactorEnabled) {
          onSecurityUpdate(false, undefined);
        } else {
          setShow2faSetup(true);
          setVerificationCode("");
        }
      };

      const handleVerify2FACode = () => {
        if (verificationCode.length < 6) {
          alert("Código inválido");
          return;
        }
        onSecurityUpdate(true, undefined);
        setShow2faSetup(false);
      };

      return (
        <div id="security-auth-section" className={`rounded-2xl border p-5 shadow-lg ${
          darkMode ? "bg-zinc-900 border-zinc-800 text-zinc-100" : "bg-white border-zinc-200 text-zinc-900"

                {user.isBiometricsConfigured ? "Desativar Biometria" : "Ativar Biometria"}

            <div className="p-4 bg-zinc-50 dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-xl flex flex-col justify-between">

                <span className="text-xs font-black text-zinc-500 uppercase block">Dois Fatores (2FA)</span>
                <p className="text-[11px] text-zinc-500 mt-1">Gera tokens temporários a cada 30 segundos.</p>
              </div>
              <button id="toggle-2fa-btn" onClick={handleToggle2FA} className={`w-full py-2 rounded-xl text-xs font-bold mt-4 ${user.isTwoFactorEnabled ? "bg-red-500 text-white" : "bg-emerald-500 text-white"}`}>
                {user.isTwoFactorEnabled ? "Desativar 2FA" : "Configurar 2FA"}
              </button>
            </div>
          </div>

          {showBiometricsModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50">
              <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl text-center text-white">
                <i data-lucide="fingerprint" className="w-12 h-12 text-emerald-500 mx-auto mb-3 animate-pulse"></i>
                <h4 className="font-bold text-sm">Validando Biometria...</h4>
                <p className="text-xs text-zinc-400 mt-1">Toque no leitor do smartphone.</p>
              </div>
            </div>
          )}

    // AI Chat Assistant (FielBot) Component
    function AiChatAssistant({ darkMode, stations, user }) {
      const [messages, setMessages] = useState([
        { id: "init", sender: "assistant", text: "Olá! Sou o **FielBot**, seu assistente PostoFiel. Posso indicar o posto mais barato hoje, listar seus pontos ou auxiliar com resgates. Pergunte qualquer coisa!" }
      ]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      const handleSendMessage = (text) => {
        if (!text.trim()) return;

        const userMsg = { id: Date.now().toString(), sender: "user", text };
        setMessages(prev => [...prev, userMsg]);
        setInputText("");
        setIsTyping(true);

        setTimeout(() => {
          let responseText = "";
          const lower = text.toLowerCase();

          if (lower.includes("barato") || lower.includes("menor preço") || lower.includes("gasolina") || lower.includes("preço")) {
            const sorted = [...stations].sort((a, b) => a.prices.gasoline - b.prices.gasoline);
            const cheapest = sorted[0];
            responseText = `O posto mais barato de Gasolina Comum hoje é o **${cheapest.name}** custando apenas **R$ ${cheapest.prices.gasoline.toFixed(2)} / Litro**. Fica localizado em: ${cheapest.address}`;
          } else if (lower.includes("pontos") || lower.includes("fidelidade") || lower.includes("saldo")) {
            responseText = `Olá ${user.name}! Você possui atualmente **${user.points} pontos** acumulados no seu perfil (Nível **${user.tier}**). Continue abastecendo pelo QR Code para acumular mais!`;
          } else if (lower.includes("cafe") || lower.includes("lavagem") || lower.includes("resgate") || lower.includes("desconto")) {
            responseText = `Temos os seguintes vouchers de resgate ativos: \n- **Café Expresso Grátis**: 100 pontos \n- **R$ 15 Desconto Combustível**: 300 pontos \n- **Lava Jato Completo**: 400 pontos \n- **Troca de Óleo**: 1200 pontos \n\nVocê possui **${user.points} pts** e pode resgatar prêmios elegíveis diretamente na aba 'Clube Fidelidade'!`;
          } else {
            responseText = `Olá! Sou o assistente FielBot inteligente. Para encontrar combustíveis baratos, digite 'posto mais barato'. Para consultar seu saldo de pontos, digite 'pontos'. Estou sempre online!`;
          }

          setMessages(prev => [...prev, { id: "bot_" + Date.now(), sender: "assistant", text: responseText }]);
          setIsTyping(false);
        }, 1200);
      };

      return (
        <div id="ai-chat-section" className={`rounded-2xl border flex flex-col h-[460px] overflow-hidden p-4 shadow-lg ${
          darkMode ? "bg-zinc-900 border-zinc-800 text-zinc-100" : "bg-white border-zinc-200 text-zinc-900"
        }`}>
          <LucideTrigger />
          <div className="flex items-center gap-2 pb-3 border-b border-zinc-100 dark:border-zinc-800 mb-3">
            <div className="w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center"><i data-lucide="bot" className="w-5 h-5"></i></div>
            <div>
              <h4 className="text-sm font-black">Suporte Inteligente FielBot</h4>
              <p className="text-[10px] text-zinc-500">Inteligência local 24h ativada</p>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto space-y-3 pr-1 custom-scrollbar">
            {messages.map((m) => (
              <div key={m.id} className={`flex max-w-[85%] flex-col p-2.5 rounded-2xl text-xs ${m.sender === "user" ? "ml-auto bg-emerald-500 text-white" : "mr-auto bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-100"}`}>
                <p className="whitespace-pre-wrap">
                  {m.text.split("**").map((part, i) => i % 2 === 1 ? <strong key={i} className="font-extrabold">{part}</strong> : part)}
                </p>
              </div>
            ))}
            {isTyping && <div className="text-zinc-500 text-xs italic">FielBot digitando...</div>}
            <div ref={messagesEndRef} />
          </div>

          <div className="flex gap-2 pt-3 border-t border-zinc-100 dark:border-zinc-800 mt-3">
            <input
              id="chat-input"
              type="text"
              placeholder="Pergunte ao FielBot..."
              value={inputText}
              onChange={(e) => setInputText(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && handleSendMessage(inputText)}
              className="flex-1 p-2 bg-zinc-100 dark:bg-zinc-800 text-xs rounded-xl focus:outline-none focus:ring-1 focus:ring-emerald-500"
            />
            <button id="chat-send-btn" onClick={() => handleSendMessage(inputText)} className="p-2.5 bg-emerald-500 text-white rounded-xl shadow"><i data-lucide="send" className="w-4 h-4"></i></button>
          </div>
        </div>
      );
    }

    // Root App Component
    function App() {
      const [activeTab, setActiveTab] = useState("mapa");
      const [darkMode, setDarkMode] = useState(true);
      const [stations, setStations] = useState(() => {
        const local = localStorage.getItem("pf_stations");
        return local ? JSON.parse(local) : initialStations;
      });
      const [user, setUser] = useState(() => {
        const local = localStorage.getItem("pf_user");
        return local ? JSON.parse(local) : initialUser;
      });
      const [history, setHistory] = useState(() => {
        const local = localStorage.getItem("pf_history");
        return local ? JSON.parse(local) : initialHistory;
      });
      const [notifications, setNotifications] = useState(() => {
        const local = localStorage.getItem("pf_notifications");
        return local ? JSON.parse(local) : initialNotifications;
      });
      const [metrics, setMetrics] = useState(() => {
        const local = localStorage.getItem("pf_metrics");
        return local ? JSON.parse(local) : {
          totalLitersSold: 105.5,
          totalBRLRevenue: 486.10,
          averageGasPrice: 5.54,
          activeUsers: 1420,
          lastBackupDate: new Date().toISOString()
        };
      });

      const [selectedStation, setSelectedStation] = useState(stations[0] || null);
      const [showNotificationsDropdown, setShowNotificationsDropdown] = useState(false);
      const [toastNotification, setToastNotification] = useState(null);

      // Persist state in LocalStorage automatically
      useEffect(() => { localStorage.setItem("pf_stations", JSON.stringify(stations)); }, [stations]);
      useEffect(() => { localStorage.setItem("pf_user", JSON.stringify(user)); }, [user]);
      useEffect(() => { localStorage.setItem("pf_history", JSON.stringify(history)); }, [history]);
      useEffect(() => { localStorage.setItem("pf_notifications", JSON.stringify(notifications)); }, [notifications]);
      useEffect(() => { localStorage.setItem("pf_metrics", JSON.stringify(metrics)); }, [metrics]);

      // Handle dark mode toggle on root document element
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }, [darkMode]);

      const handleSelectStation = (station) => setSelectedStation(station);

      const handleFuelRedirect = (station) => {
        setSelectedStation(station);
        setTimeout(() => {
          document.getElementById("fueling-calculator-section")?.scrollIntoView({ behavior: "smooth" });
        }, 150);
      };

      const handleFuelingSuccess = (record) => {
        setHistory(prev => [record, ...prev]);
        
        // Update user profile
        const updatedPoints = user.points + record.pointsEarned;
        let tier = "Bronze";
        if (updatedPoints >= 1500) tier = "Ouro";
        else if (updatedPoints >= 600) tier = "Prata";

        setUser(prev => ({ ...prev, points: updatedPoints, tier }));

        // Update metrics
        setMetrics(prev => ({
          ...prev,
          totalLitersSold: prev.totalLitersSold + record.liters,
          totalBRLRevenue: prev.totalBRLRevenue + record.totalCost
        }));

        // Trigger notification
        const loyaltyPush = {
          id: "n_loyalty_" + Date.now(),
          title: "Pontos Acumulados! 🎉",
          body: `Você ganhou +${record.pointsEarned} pontos PostoFiel abastecendo no ${record.stationName}. Saldo atual: ${updatedPoints} pts.`,
          timestamp: new Date().toISOString(),
          read: false,
          type: "loyalty"
        };
        setNotifications(prev => [loyaltyPush, ...prev]);
        setToastNotification(loyaltyPush);
        setTimeout(() => setToastNotification(null), 5000);

        setTimeout(() => setActiveTab("historico"), 1500);
      };

      const handleRedeemReward = (pointsCost, rewardTitle) => {
        setUser(prev => ({ ...prev, points: prev.points - pointsCost }));
      };

      const handleShareReward = (extraPoints) => {
        setUser(prev => ({ ...prev, points: prev.points + extraPoints }));
      };

      const handleSecurityUpdate = (toggle2FA, toggleBiometrics) => {
        setUser(prev => ({
          ...prev,
          isTwoFactorEnabled: toggle2FA !== undefined ? toggle2FA : prev.isTwoFactorEnabled,
          isBiometricsConfigured: toggleBiometrics !== undefined ? toggleBiometrics : prev.isBiometricsConfigured
        }));
      };

      const handleUpdateStationPrice = (stationId, fuelType, newPrice) => {
        setStations(prev => prev.map(s => s.id === stationId ? { ...s, prices: { ...s.prices, [fuelType]: newPrice } } : s));
      };

      const handleAddStation = (newStation) => {
        const payload = { ...newStation, id: (stations.length + 1).toString(), rating: 4.0, features: ["Wi-Fi", "Calibrador"] };
        setStations(prev => [...prev, payload]);
      };

      const handleTriggerBackup = () => {
        setMetrics(prev => ({ ...prev, lastBackupDate: new Date().toISOString() }));
        alert("Backup redundante armazenado no Cloud SQL.");
      };

      const handleTriggerPushPromo = (type) => {
        const alertPush = {
          id: "n_alert_" + Date.now(),
          title: type === "price_drop" ? "Queda de preço! 📉" : "Desconto Exclusivo 🏷️",
          body: type === "price_drop" ? "Gasolina aditivada caiu para R$ 5,39/L no Posto Ale Brigadeiro! Aproveite." : "Use o cupom FIEL10 no QR Code do app e ganhe 10% de desconto no próximo abastecimento!",
          timestamp: new Date().toISOString(),
          read: false,
          type
        };
        setNotifications(prev => [alertPush, ...prev]);
        setToastNotification(alertPush);
        setTimeout(() => setToastNotification(null), 5000);
      };

      const handleMarkNotificationsRead = () => {
        setShowNotificationsDropdown(!showNotificationsDropdown);
        setNotifications(prev => prev.map(n => ({ ...n, read: true })));
      };

      const unreadCount = notifications.filter(n => !n.read).length;

      return (
        <div className="min-h-screen transition-all duration-300">
          <LucideTrigger />
          {toastNotification && (
            <div id="push-toast-alert" className="fixed top-5 right-5 z-50 max-w-sm rounded-2xl bg-zinc-900 border border-zinc-800 text-white p-4 shadow-2xl flex gap-3.5 items-start animate-slide-in">
              <div className="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-xl"><i data-lucide="bell" className="w-5 h-5 animate-bounce"></i></div>
              <div className="flex-1 min-w-0">
                <h5 className="font-bold text-xs text-emerald-400">Notificação Push!</h5>
                <p className="font-extrabold text-sm mt-1">{toastNotification.title}</p>
                <p className="text-xs text-zinc-400 mt-1 leading-snug">{toastNotification.body}</p>
              </div>
              <button id="toast-dismiss-btn" onClick={() => setToastNotification(null)} className="text-xs text-zinc-500 font-bold">Fechar</button>
            </div>
          )}

          <div className="max-w-6xl mx-auto px-4 py-6 flex flex-col min-h-screen gap-6">
            <header id="app-header" className={`p-4 rounded-2xl border flex flex-col sm:flex-row justify-between items-center gap-4 shadow-md ${darkMode ? "bg-zinc-900 border-zinc-800" : "bg-white border-zinc-200"}`}>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-white shadow-lg"><i data-lucide="flame" className="w-6 h-6 animate-pulse"></i></div>
                <div>
                  <h1 className="text-lg font-black tracking-tight flex items-center gap-1">PostoFiel <span className="text-[10px] font-bold bg-emerald-500 text-white px-1.5 py-0.5 rounded uppercase">Fidelidade</span></h1>
                  <p className="text-[10px] text-zinc-500 font-medium">Buscador Inteligente & Pagamentos via QR Code</p>
                </div>
              </div>

              <div className="flex items-center gap-3 self-stretch sm:self-auto justify-between sm:justify-end">
                {user && (
                  <div className={`px-3.5 py-1.5 rounded-xl border flex items-center gap-2 ${darkMode ? "bg-zinc-800/50 border-zinc-700/50" : "bg-zinc-50 border-zinc-200"}`}>
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span className="text-xs font-black text-amber-500">{user.points} <span className="text-[10px] font-semibold text-zinc-500">pts</span></span>

            </header>

            <nav id="app-navigation-hub" className={`p-1.5 rounded-2xl border flex gap-1 overflow-x-auto shadow-sm custom-scrollbar ${darkMode ? "bg-zinc-900 border-zinc-800" : "bg-white border-zinc-200"}`}>
              <button id="tab-mapa" onClick={() => setActiveTab("mapa")} className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition-all flex flex-col items-center gap-1 min-w-[90px] ${activeTab === "mapa" ? "bg-emerald-500 text-white shadow" : "text-zinc-500"}`}><i data-lucide="compass" className="w-4.5 h-4.5"></i>Mapa</button>
              <button id="tab-fidelidade" onClick={() => setActiveTab("fidelidade")} className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition-all flex flex-col items-center gap-1 min-w-[90px] ${activeTab === "fidelidade" ? "bg-emerald-500 text-white shadow" : "text-zinc-500"}`}><i data-lucide="award" className="w-4.5 h-4.5"></i>Fidelidade</button>
              <button id="tab-historico" onClick={() => setActiveTab("historico")} className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition-all flex flex-col items-center gap-1 min-w-[90px] ${activeTab === "historico" ? "bg-emerald-500 text-white shadow" : "text-zinc-500"}`}><i data-lucide="history" className="w-4.5 h-4.5"></i>Histórico</button>
              <button id="tab-chat" onClick={() => setActiveTab("chat")} className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition-all flex flex-col items-center gap-1 min-w-[90px] ${activeTab === "chat" ? "bg-emerald-500 text-white shadow" : "text-zinc-500"}`}><i data-lucide="message-square" className="w-4.5 h-4.5"></i>FielBot</button>
              <button id="tab-seguranca" onClick={() => setActiveTab("seguranca")} className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition-all flex flex-col items-center gap-1 min-w-[90px] ${activeTab === "seguranca" ? "bg-emerald-500 text-white shadow" : "text-zinc-500"}`}><i data-lucide="shield-check" className="w-4.5 h-4.5"></i>Segurança</button>
              <button id="tab-admin" onClick={() => setActiveTab("admin")} className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition-all flex flex-col items-center gap-1 min-w-[90px] ${activeTab === "admin" ? "bg-emerald-500 text-white shadow" : "text-zinc-500"}`}><i data-lucide="settings" className="w-4.5 h-4.5"></i>Admin</button>
            </nav>

            <main className="flex-1">
              {activeTab === "mapa" && (
                <div className="space-y-6">
                  <InteractiveMap stations={stations} selectedStation={selectedStation} onSelectStation={handleSelectStation} onFuelClick={handleFuelRedirect} darkMode={darkMode} />
                  {selectedStation && user ? (
                    <FuelingCalculator station={selectedStation} user={user} onPaymentSuccess={handleFuelingSuccess} darkMode={darkMode} />
                  ) : (
                    <div className={`p-6 rounded-2xl border text-center shadow-sm ${darkMode ? "bg-zinc-900 border-zinc-800 text-zinc-500" : "bg-white border-zinc-200 text-zinc-400"}`}>
                      <i data-lucide="compass" className="w-10 h-10 mx-auto mb-2 opacity-30 animate-pulse"></i>
                      <p className="text-sm font-bold">Selecione um posto no mapa acima para abastecer.</p>
                    </div>
                  )}
                </div>
              )}

              {activeTab === "fidelidade" && user && (
                <LoyaltyDashboard user={user} onRedeemReward={handleRedeemReward} onShareReward={handleShareReward} darkMode={darkMode} />
              )}

              {activeTab === "historico" && user && (
                <HistoryAndAnalytics history={history} user={user} darkMode={darkMode} />
              )}

              {activeTab === "chat" && (
                <AiChatAssistant darkMode={darkMode} stations={stations} user={user} />
              )}

              {activeTab === "seguranca" && user && (
                <SecurityAuth user={user} onSecurityUpdate={handleSecurityUpdate} darkMode={darkMode} />
              )}

              {activeTab === "admin" && metrics && (
                <AdminPanel stations={stations} metrics={metrics} onUpdateStationPrice={handleUpdateStationPrice} onAddStation={handleAddStation} onTriggerBackup={handleTriggerBackup} onTriggerPushPromo={handleTriggerPushPromo} darkMode={darkMode} />
              )}
            </main>

            <footer className="text-center py-4 text-[10px] text-zinc-500 border-t border-zinc-500/10 mt-auto flex flex-col sm:flex-row justify-between items-center gap-2">
              <p>© 2026 PostoFiel Inc. Todos os direitos reservados. Rede Credenciada São Paulo, SP.</p>
              <div className="flex gap-3 font-semibold">
                <a href="#interactive-map-section" className="hover:text-emerald-500">Mapa</a>
                <span>•</span>
                <a href="#loyalty-dashboard-section" className="hover:text-emerald-500">Fidelidade</a>
                <span>•</span>
                <a href="#security-auth-section" className="hover:text-emerald-500">Segurança</a>
              </div>
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
